# Fly.io に置くときの設定
# 手順は DEPLOY.md を見てください
app = "restore-cost"          # 好きな名前に変える（世界で一意）
primary_region = "nrt"        # 東京

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  RESTORE_PUBLIC = "1"
  # RESTORE_TOKEN は secrets で渡す（ここには書かない）

[http_service]
  internal_port = 8080
  force_https = true

# データを置く、消えないディスク
[mounts]
  source = "restore_data"
  destination = "/data"
