<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="原価管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>レストア原価管理</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand" title="車両一覧へ">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".3"/>
        <path d="M4.9 17.4A9 9 0 0 1 12 2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 12l4.6-3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
      </svg></span>
      <b>レストア原価管理</b><span>COST&nbsp;LEDGER</span>
    </div>
    <button class="btn dark" id="btnHome" hidden>←<span class="lbl"> 車両一覧</span></button>
    <button class="btn dark" id="btnNew">＋<span class="lbl"> 車両を追加</span></button>
    <input class="search top" id="vehSearch" type="search" placeholder="車名・車台番号で検索">
    <span class="spacer"></span>
    <button class="btn dark hide-mobile" id="btnUndo" title="元に戻す (Ctrl+Z)">↶ 元に戻す</button>
    <button class="btn dark hide-mobile" id="btnRedo" title="やり直す (Ctrl+Shift+Z)">↷ やり直す</button>
    <button class="btn dark hide-mobile" id="btnWorkers">職人・単価</button>
    <button class="btn dark hide-mobile" id="btnCsv">CSV書出</button>
    <button class="btn dark hide-mobile" id="btnBackup">バックアップ</button>
    <button class="btn dark hide-mobile" id="btnRestore">復元</button>
    <button class="btn dark hide-mobile" id="btnPrint">印刷 / PDF</button>
    <button class="btn dark only-mobile" id="btnMenu" title="メニュー">⋯</button>
    <span class="saved" id="savedAt" title="保存の状態"></span>
  </header>

  <div class="main">
    <aside class="sidebar no-print">
      <div class="sidebar-head">
        <div class="sidebar-title">車両一覧</div>
      </div>
      <div class="veh-list" id="vehList"></div>
      <div class="sidebar-foot">
        <span id="vehCount">0 台</span>
        <span id="grandAll"></span>
      </div>
    </aside>

    <main class="detail" id="detail"></main>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" hidden>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="assets/js/format.js"></script>
<script src="assets/js/calc.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/passkey.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/sample.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
